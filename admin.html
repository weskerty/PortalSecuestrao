<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Portal</title>
<style>

@font-face{
  font-family:'Comfortaa';
  src:url('font.woff2') format('woff2');
  font-weight:400 700;
  font-display:swap;
}

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --fg:#fff;
  --dim:rgba(255,255,255,.58);
  --acc:#7cf7c2;
  --err:#ff5c7a;
  --glass:rgba(255,255,255,.08);
  --glass2:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.12);
  color-scheme:dark;
}

body{
  min-height:100vh;
  color:var(--fg);
  font-family:'Comfortaa',sans-serif;
  font-size:13px;
  background:url('wallpaper.avif') center/cover no-repeat fixed;
  overflow:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(2px);
}

#login{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
  z-index:1;
  padding:20px;
}

.lcard{
  width:100%;
  max-width:320px;
  padding:34px 28px;
  border-radius:26px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:
    0 12px 50px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.06);
}

.lcard h2{
  margin-bottom:22px;
  color:var(--acc);
  font-size:1rem;
  letter-spacing:.16em;
  text-align:center;
}

input[type=text],
input[type=password]{
  width:100%;
  padding:13px 14px;
  margin-bottom:12px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.06);
  color:var(--fg);
  font-family:'Comfortaa',sans-serif;
  outline:none;
  transition:.18s;
  backdrop-filter:blur(10px);
}

input::placeholder{
  color:rgba(255,255,255,.45);
}

input:focus{
  border-color:rgba(124,247,194,.5);
  background:rgba(255,255,255,.09);
  box-shadow:0 0 0 4px rgba(124,247,194,.08);
}

button{
  padding:11px 16px;
  border:none;
  border-radius:16px;
  cursor:pointer;
  font-weight:700;
  letter-spacing:.08em;
  font-family:'Comfortaa',sans-serif;
  transition:.16s;
}

button:hover{
  transform:translateY(-1px);
  opacity:.92;
}

button:active{
  transform:scale(.98);
}

button:not(.sec):not(.danger){
  background:var(--acc);
  color:#000;
}

button.sec{
  background:rgba(255,255,255,.06);
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
}

button.danger{
  background:rgba(255,92,122,.18);
  color:#fff;
  border:1px solid rgba(255,92,122,.22);
}

#lerr{
  margin-top:12px;
  color:var(--err);
  font-size:11px;
  text-align:center;
}

#app{
  display:none;
  flex-direction:column;
  height:100vh;
  position:relative;
  z-index:1;
  padding:14px;
  gap:12px;
}

.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  border-radius:24px;
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 10px 35px rgba(0,0,0,.25);
  flex-shrink:0;
}

.topbar h1{
  flex:1;
  color:var(--acc);
  font-size:.86rem;
  letter-spacing:.18em;
}

.topbar .user{
  color:var(--dim);
  font-size:11px;
}

.tabs{
  display:flex;
  gap:8px;
  padding:8px;
  border-radius:22px;
  background:var(--glass2);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  overflow:auto hidden;
  flex-shrink:0;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  padding:12px 16px;
  border-radius:14px;
  cursor:pointer;
  color:var(--dim);
  font-size:11px;
  letter-spacing:.08em;
  white-space:nowrap;
  transition:.15s;
}

.tab:hover{
  background:rgba(255,255,255,.05);
  color:#fff;
}

.tab.on{
  background:rgba(124,247,194,.14);
  color:var(--acc);
  box-shadow:inset 0 0 0 1px rgba(124,247,194,.15);
}

.panel{
  display:none;
  flex:1;
  overflow:auto;
  padding:18px;
  border-radius:28px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  box-shadow:0 12px 45px rgba(0,0,0,.28);
}

.panel.on{
  display:flex;
  flex-direction:column;
}

#p3{
  padding:0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:10px 12px;
  color:rgba(255,255,255,.5);
  font-size:10px;
  letter-spacing:.14em;
  border-bottom:1px solid rgba(255,255,255,.08);
}

td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.06);
  vertical-align:top;
  word-break:break-word;
}

tr:hover td{
  background:rgba(255,255,255,.03);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:5px 10px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
}

.badge.ok{
  background:rgba(124,247,194,.14);
  color:var(--acc);
}

.badge.warn{
  background:rgba(255,92,122,.16);
  color:var(--err);
}

.badge.free{
  background:rgba(100,160,255,.14);
  color:#8bc0ff;
}

textarea{
  width:100%;
  flex:1;
  padding:16px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.22);
  color:#fff;
  resize:none;
  outline:none;
  font-family:monospace;
  backdrop-filter:blur(16px);
}

textarea:focus{
  border-color:rgba(124,247,194,.35);
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:14px;
  align-items:center;
  flex-shrink:0;
}

.loglist{
  font-size:11px;
  line-height:1.9;
  overflow:auto;
}

.loglist div{
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.loglist span{
  color:var(--dim);
}

.shell-wrap{
  display:flex;
  flex-direction:column;
  height:100%;
  border-radius:28px;
  overflow:hidden;
}

#termOut{
  flex:1;
  overflow-y:auto;
  padding:18px;
  font-family:monospace;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
  background:rgba(0,0,0,.3);
}

.shell-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  background:rgba(255,255,255,.05);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
}

.shell-row span{
  color:var(--acc);
}

#shInput{
  flex:1;
  border:none;
  background:transparent;
  color:#fff;
  outline:none;
  font-family:monospace;
  font-size:13px;
}

#shInput::placeholder{
  color:rgba(255,255,255,.35);
}

.t-sys{color:#7cf7c2}
.t-out{color:#fff}
.t-err{color:#ff5c7a}
.t-cmd{color:#ffd700}

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:999px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

</style>
</head>
<body>

<div id="login">
  <div class="lcard">
    <h2>PORTAL ADMIN</h2>
    <input id="lu" type="text" placeholder="Usuario" autocomplete="username"/>
    <input id="lp" type="password" placeholder="Contrasena" autocomplete="current-password"/>
    <button onclick="doLogin()" style="width:100%">ENTRAR</button>
    <div id="lerr" style="margin-top:10px;color:var(--err);font-size:11px"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>PORTAL ADMIN</h1>
    <span class="user" id="topUser"></span>
    <button class="sec" onclick="refresh()">&#8635;</button>
    <button class="danger" onclick="stopSrv()">&#9632; Stop</button>
    <button class="sec" onclick="doLogout()">Salir</button>
  </div>
  <div class="tabs">
    <div class="tab on"  onclick="setTab(0)">DISPOSITIVOS</div>
    <div class="tab"     onclick="setTab(1)">LOG DNS</div>
    <div class="tab"     onclick="setTab(2)">CONFIG</div>
    <div class="tab"     onclick="setTab(3)">TERMINAL</div>
  </div>

  <div id="p0" class="panel on">
    <table>
      <thead><tr><th>MAC</th><th>IP</th><th>Estado</th><th>Hora</th><th>Dominios recientes</th><th></th></tr></thead>
      <tbody id="dtable"></tbody>
    </table>
  </div>

  <div id="p1" class="panel">
    <div id="loglist" class="loglist"></div>
  </div>

  <div id="p2" class="panel">
    <div class="row">
      <button onclick="saveEnv()">Guardar .env</button>
      <span style="color:var(--dim);font-size:11px" id="envsave"></span>
    </div>
    <textarea id="envtxt" spellcheck="false"></textarea>
  </div>

  <div id="p3" class="panel">
    <div class="shell-wrap">
      <div id="termOut"></div>
      <div class="shell-row">
        <span>$</span>
        <input id="shInput" placeholder="comando..." autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button onclick="runCmd()">Run</button>
      </div>
    </div>
  </div>
</div>

<script>
let token = '';
let ws = null;
let curTab = 0;
let refreshTimer = null;
const hist = [];
let histIdx = -1;

function gc(k) {
  return (document.cookie.split(';').find(c => c.trim().startsWith(k + '=')) || '').split('=').slice(1).join('=');
}
function sc(k, v, days) {
  const exp = days ? `;max-age=${days * 86400}` : '';
  document.cookie = `${k}=${v};path=/${exp}`;
}

async function api(method, url, body) {
  try {
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401 || r.status === 403) { showLogin(); return null; }
    return r.json().catch(() => ({}));
  } catch (_) { return null; }
}

function showLogin() {
  token = '';
  sc('at', '', -1);
  clearInterval(refreshTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
}

function showApp(user) {
  document.getElementById('topUser').textContent = user || '';
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

async function doLogin() {
  const u = document.getElementById('lu').value;
  const p = document.getElementById('lp').value;
  const d = await api('POST', '/api/login', { user: u, pass: p });
  if (d && d.ok) {
    token = d.token;
    sc('at', token, 7);
    showApp(d.user);
    setTab(0);
  } else if (d !== null) {
    document.getElementById('lerr').textContent = 'Credenciales incorrectas';
  }
}

async function doLogout() {
  await api('POST', '/api/logout');
  showLogin();
}

function setTab(i) {
  clearInterval(refreshTimer);
  curTab = i;
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('on', i === j));
  document.querySelectorAll('.panel').forEach((p, j) => p.classList.toggle('on', i === j));
  if (i === 0) { refresh(); refreshTimer = setInterval(refresh, 10000); }
  if (i === 1) loadLog();
  if (i === 2) loadEnv();
  if (i === 3) initTerm();
}

function fmt(ms) { return new Date(ms).toLocaleTimeString(); }

async function refresh() {
  const devs = await api('GET', '/api/devices');
  if (!Array.isArray(devs)) return;
  document.getElementById('dtable').innerHTML = devs.map(d => {
    const st = d.restricted
      ? '<span class="badge warn">Solo WA</span>'
      : '<span class="badge ok">Abierto</span>';
    const fr = d.free ? '<span class="badge free">FREE</span>' : '';
    const doms = (d.domains || []).slice(-4).reverse()
      .map(x => `<div style="color:var(--dim);font-size:11px">${x}</div>`).join('');
    return `<tr><td>${d.mac} ${fr}</td><td>${d.ip}</td><td>${st}</td><td>${fmt(d.authedAt)}</td><td>${doms}</td><td><button class="danger" onclick="deauth('${d.mac}')">Kick</button></td></tr>`;
  }).join('');
}

async function deauth(mac) {
  const d = await api('POST', '/api/deauth/' + mac);
  if (d) refresh();
}

async function loadLog() {
  const logs = await api('GET', '/api/log');
  if (!Array.isArray(logs)) return;
  document.getElementById('loglist').innerHTML = logs.slice().reverse().map(l => {
    const t = fmt(l.ts);
    if (l.type === 'dns')    return `<div><span>${t}</span> <b>${l.mac || '?'}</b> &rarr; ${l.data}</div>`;
    if (l.type === 'auth')   return `<div><span>${t}</span> <b>${l.mac}</b> <span class="badge ok">AUTH</span> ${l.ip}</div>`;
    if (l.type === 'deauth') return `<div><span>${t}</span> <b>${l.mac}</b> <span class="badge warn">DEAUTH</span></div>`;
    return '';
  }).join('');
}

async function loadEnv() {
  const d = await api('GET', '/api/env');
  if (d) document.getElementById('envtxt').value = d.content || '';
}

async function saveEnv() {
  const content = document.getElementById('envtxt').value;
  const d = await api('POST', '/api/env', { content });
  if (!d) return;
  const el = document.getElementById('envsave');
  el.textContent = 'Guardado';
  setTimeout(() => el.textContent = '', 2000);
}

async function stopSrv() {
  if (!confirm('Detener el servidor?')) return;
  await api('POST', '/api/stop');
}

const ANSI = { '31': 'color:#ff5c7a', '32': 'color:#7cf7c2', '33': 'color:#ffd700', '36': 'color:#64d8ff', '1': 'font-weight:bold' };

function ansi(s) {
  const safe = s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return '<span>' + safe.replace(/\x1b\[([0-9;]*)m/g, (_, c) => {
    if (!c || c === '0') return '</span><span>';
    const st = c.split(';').map(x => ANSI[x]).filter(Boolean).join(';');
    return st ? `</span><span style="${st}">` : '</span><span>';
  }) + '</span>';
}

function termWrite(text, cls) {
  const out = document.getElementById('termOut');
  const div = document.createElement('div');
  if (cls) {
    div.className = cls;
    div.textContent = text;
  } else {
    div.innerHTML = ansi(text.replace(/\r\n/g, '\n').replace(/\r/g, ''));
  }
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function initTerm() {
  if (ws) return;
  document.getElementById('termOut').innerHTML = '';
  termWrite('Terminal lista. Usa el campo de abajo para enviar comandos.', 't-sys');
  connectWS();
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/shell`);
  ws.onopen = () => termWrite('WS conectado', 't-sys');
  ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.stdout) termWrite(d.stdout);
      if (d.stderr) termWrite(d.stderr, 't-err');
      if (d.err)    termWrite(d.err, 't-err');
      termWrite('$ ', 't-sys');
    } catch (_) {}
  };
  ws.onclose = () => { ws = null; termWrite('WS desconectado', 't-err'); };
  ws.onerror = () => { termWrite('WS error', 't-err'); };
}

function runCmd() {
  const inp = document.getElementById('shInput');
  const cmd = inp.value.trim();
  if (!cmd) return;
  if (!ws || ws.readyState !== 1) {
    termWrite('WS no conectado. Reconectando...', 't-err');
    connectWS();
    return;
  }
  hist.push(cmd);
  histIdx = -1;
  termWrite('> ' + cmd, 't-cmd');
  ws.send(cmd);
  inp.value = '';
}

document.getElementById('shInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { runCmd(); return; }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < hist.length - 1) histIdx++;
    e.target.value = hist[hist.length - 1 - histIdx] || '';
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; e.target.value = hist[hist.length - 1 - histIdx] || ''; }
    else { histIdx = -1; e.target.value = ''; }
  }
});
document.getElementById('lp').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

(async function init() {
  const st = gc('at');
  if (!st) return;
  token = st;
  const me = await api('GET', '/api/me');
  if (me && me.user) { showApp(me.user); setTab(0); }
})();
</script>
</body>
</html>
